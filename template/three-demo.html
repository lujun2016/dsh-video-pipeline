<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#070b10;}
  #c{position:absolute;inset:0;}
  #title{position:absolute;left:80px;top:220px;font:700 64px "PingFang SC",sans-serif;color:#e6edf5;}
  #sub{position:absolute;left:80px;top:310px;font:400 32px "PingFang SC",sans-serif;color:#5eead4;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="title">3D 示例 · 粒子关系图</div>
<div id="sub">three.js · 由 t 驱动，可逐帧渲染</div>
<script type="module">
import * as THREE from './node_modules/three/build/three.module.js';

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070b10, 0.0012);
const camera = new THREE.PerspectiveCamera(38, W / H, 1, 8000);
camera.position.set(0, 0, 1600);

// 粒子云（固定种子）
let seed = 42;
const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
const N = 1200;
const pos = new Float32Array(N * 3);
const col = new Float32Array(N * 3);
const c1 = new THREE.Color(0x5eead4), c2 = new THREE.Color(0x60a5fa);
for (let i = 0; i < N; i++) {
  const r = 300 + rnd() * 900, a = rnd() * Math.PI * 2, b = Math.acos(2 * rnd() - 1);
  pos[i * 3] = r * Math.sin(b) * Math.cos(a);
  pos[i * 3 + 1] = r * Math.cos(b) * 0.7;
  pos[i * 3 + 2] = r * Math.sin(b) * Math.sin(a);
  const c = c1.clone().lerp(c2, rnd());
  col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
const mat = new THREE.PointsMaterial({ size: 6, vertexColors: true, transparent: true, opacity: 0.9 });
const points = new THREE.Points(geo, mat);
scene.add(points);

// 关系线：随机连 200 条
const linePos = new Float32Array(200 * 2 * 3);
for (let i = 0; i < 200; i++) {
  const a = Math.floor(rnd() * N), b = Math.floor(rnd() * N);
  linePos.set([pos[a * 3], pos[a * 3 + 1], pos[a * 3 + 2]], i * 6);
  linePos.set([pos[b * 3], pos[b * 3 + 1], pos[b * 3 + 2]], i * 6 + 3);
}
const lgeo = new THREE.BufferGeometry();
lgeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
const lines = new THREE.LineSegments(lgeo, new THREE.LineBasicMaterial({ color: 0x2d6f6a, transparent: true, opacity: 0.35 }));
scene.add(lines);

window.__seek = (t) => {
  points.rotation.y = t * 0.12;
  points.rotation.x = Math.sin(t * 0.15) * 0.15;
  lines.rotation.copy(points.rotation);
  camera.position.z = 1600 + Math.sin(t * 0.2) * 120;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
};
window.__duration = 30;
window.__seek(0);
</script>
</body>
</html>
